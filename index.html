<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pandemic: La cura</title>
<style>
:root{--bg:#0c1722;--panel:#13263a;--in:#0f2133;--line:#2b4660;--ink:#d9e6f2;--mut:#8aa3b8;--acc:#4fb6e3}
*{box-sizing:border-box}
body{margin:0;background:#061522;color:var(--ink);font:14px/1.35 'Segoe UI',system-ui,sans-serif;position:relative;min-height:100vh;overflow-x:hidden}body::before{content:'';position:fixed;inset:-18px;z-index:0;pointer-events:none;background-image:url('/fondo-pandemic-real.png');background-position:center center;background-repeat:no-repeat;background-size:cover;filter:blur(1.5px) brightness(.48) saturate(.82);transform:scale(1.015);will-change:transform,filter}body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(4,14,25,.22)}#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:12px;background:transparent}
button,input,select{font:inherit}
.fx-epidemic{position:fixed;inset:0;z-index:9000;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(255,70,70,.24) 0%,rgba(190,0,0,.22) 52%,rgba(120,0,0,.34) 100%);box-shadow:inset 0 0 0 9999px rgba(255,25,25,.08);backdrop-filter:brightness(1.12) saturate(1.18);animation:epiflash 2s ease-in-out both}
.fx-epidemic .fx-word{font-size:clamp(46px,8vw,110px);font-weight:1000;letter-spacing:.08em;color:#fff;text-shadow:0 0 10px #7f0000,0 0 28px #ff2d2d,0 5px 26px rgba(0,0,0,.45);transform:scale(.96);animation:epitext 2s cubic-bezier(.2,.75,.2,1) both}
@keyframes epiflash{0%{opacity:0;background:rgba(255,0,0,0)}12%{opacity:1}78%{opacity:1}100%{opacity:0;background:rgba(120,0,0,0)}}
@keyframes epitext{0%{opacity:0;transform:scale(.78);filter:blur(5px)}16%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1.015)}100%{opacity:0;transform:scale(1.04);filter:blur(1px)}}
.fx-outbreak{position:absolute;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,rgba(255,40,40,.34) 0%,rgba(190,0,0,.2) 48%,rgba(110,0,0,.48) 100%);box-shadow:inset 0 0 0 5px rgba(255,95,95,.88),0 0 28px 8px rgba(255,35,35,.95);animation:brotes 2s ease-in-out both}
.fx-outbreak .fx-word{font-size:clamp(18px,5cqw,44px);font-weight:1000;letter-spacing:.08em;color:#fff;text-shadow:0 0 7px #700,0 0 20px #f33,0 3px 9px rgba(0,0,0,.6);animation:brotetext 2s ease-out both}
@keyframes brotes{0%{opacity:0;transform:scale(.82)}15%{opacity:1;transform:scale(1.03)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
@keyframes brotetext{0%{opacity:0;transform:scale(.7)}14%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
.fx-cure{position:fixed;inset:0;z-index:9001;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,rgba(86,255,154,.28) 0%,rgba(21,143,78,.2) 48%,rgba(4,75,39,.42) 100%);box-shadow:inset 0 0 0 9999px rgba(45,220,120,.12);backdrop-filter:brightness(1.08) saturate(1.12);animation:cureflash 5s ease-in-out both}
.fx-cure .fx-cure-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 36px;max-width:min(92vw,980px);border:1px solid rgba(196,255,220,.45);border-radius:22px;background:rgba(8,43,27,.22);box-shadow:0 0 34px rgba(54,255,140,.25),inset 0 0 28px rgba(255,255,255,.04);backdrop-filter:blur(4px)}
.fx-cure .fx-word{font-size:clamp(34px,6vw,82px);font-weight:1000;letter-spacing:.06em;color:#fff;text-shadow:0 0 10px #0a7a43,0 0 30px #2dff88,0 5px 24px rgba(0,0,0,.42);animation:curetext 5s cubic-bezier(.2,.75,.2,1) both}
.fx-cure .fx-sub{font-size:clamp(16px,2vw,28px);font-weight:600;color:#eafff1;text-shadow:0 2px 12px rgba(0,0,0,.45)}
@keyframes cureflash{0%{opacity:0;background:rgba(20,180,90,0)}10%{opacity:1}82%{opacity:1}100%{opacity:0;background:rgba(8,100,50,0)}}
@keyframes curetext{0%{opacity:0;transform:scale(.82);filter:blur(4px)}12%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1.01)}100%{opacity:0;transform:scale(1.03);filter:blur(1px)}}
#app.game{max-width:none;margin:0;height:100vh;padding:8px;display:grid;gap:8px;grid-template-columns:minmax(170px,19%) minmax(125px,14%) minmax(0,1fr) minmax(330px,28%);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"top top top right" "players cdc ring right" "events events ring right"}
.p,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0;min-height:0}
.card{padding:14px}.home{max-width:380px;margin:40px auto}
h1{margin:0 0 10px;font-size:24px}
/* Pantalla de inicio horizontal */
.home-screen{min-height:calc(100vh - 24px);width:100%;display:grid;grid-template-columns:minmax(380px,46%) minmax(520px,54%);gap:clamp(24px,4vw,70px);align-items:center;padding:clamp(26px,5vh,60px) clamp(24px,5vw,80px);position:relative;overflow:hidden}
.home-planet{height:min(82vh,760px);display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.home-planet::after{content:'';position:absolute;width:72%;height:72%;border-radius:50%;background:radial-gradient(circle,rgba(54,187,255,.16),rgba(54,187,255,0) 68%);filter:blur(18px);z-index:-1}
.home-planet img{width:min(100%,760px);height:min(100%,760px);object-fit:contain;filter:saturate(.9) brightness(.76) drop-shadow(0 0 28px rgba(79,182,227,.18));opacity:.93;mix-blend-mode:screen;user-select:none;pointer-events:none}
.home-content{width:100%;max-width:760px;justify-self:start;display:flex;flex-direction:column;gap:18px}
.home-title{font-size:clamp(42px,5.2vw,78px);line-height:.95;letter-spacing:-.045em;margin:0;color:#ecf8ff;text-wrap:balance;text-shadow:0 0 26px rgba(79,182,227,.26),0 4px 18px rgba(0,0,0,.28)}
.home-subtitle{margin:-6px 0 2px;color:#9fc0d5;font-size:clamp(14px,1.3vw,18px)}
.home-glass{background:linear-gradient(180deg,rgba(13,30,46,.82),rgba(8,21,34,.72));border:1px solid rgba(104,174,216,.36);border-radius:18px;padding:18px;box-shadow:0 18px 42px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(8px)}
.home-name{display:flex;align-items:center;gap:12px}.home-name label{flex:1;color:#b9cfdf;font-weight:600}.home-name input{margin-top:7px;font-size:17px;padding:12px 13px;background:rgba(5,17,28,.68);border-color:#39637d}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.home-action{min-width:0;padding:15px;background:rgba(10,30,46,.68);border:1px solid rgba(79,182,227,.22);border-radius:14px}.home-action h3{margin:0 0 5px;font-size:15px;color:#dff4ff}.home-action p{margin:0 0 10px;color:#8eabba;font-size:12px}.home-action .row{display:flex;gap:7px;align-items:center}.home-action input{margin:0;flex:1;min-width:0;padding:9px 10px}.home-action button{white-space:nowrap}
.home-local{margin-top:12px}.home-local-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.home-local-grid label{color:#adc5d5;font-weight:600}.home-local-grid select{margin-top:7px;padding:9px 10px}.home-local button{height:38px;margin:0 0 8px}.home-badge{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:999px;background:rgba(79,182,227,.1);border:1px solid rgba(79,182,227,.28);color:#8fd7fb;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.home-screen .err{min-height:18px;margin:0 2px}.home-screen .home-footer{color:#7e98ab;font-size:11px;text-align:center;margin-top:-4px}
.rules-home{margin-top:4px}
.rules-game{display:flex;align-items:flex-end;gap:7px;padding:0 6px 6px}
.rules-game>details{flex:1;min-width:0}
.rules-game>.character-guide{flex:1.8 1 0;min-width:0}
.rules-game>.rules-wrap{flex:1 1 0;min-width:0}
.rules-game>.exit-game{flex:0 0 auto;width:auto!important;padding:2px 5px!important;margin:0 0 1px!important;font-size:9px!important;line-height:1.1;opacity:.72;border-radius:5px}
.rules-game>.exit-game:hover{opacity:1}
.rules-wrap details{background:rgba(8,24,38,.78);border:1px solid rgba(79,182,227,.28);border-radius:12px;color:var(--ink);backdrop-filter:blur(7px);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.rules-wrap summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;letter-spacing:.02em;color:#dff5ff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rules-wrap summary::-webkit-details-marker{display:none}
.rules-wrap summary::after{content:'+';font-size:20px;line-height:1;color:#76d2f7}
.rules-wrap details[open] summary::after{content:'−'}
.rules-body{padding:0 12px 12px;max-height:42vh;overflow:auto;border-top:1px solid rgba(79,182,227,.12)}
.rules-body h4{margin:10px 0 4px;color:#9fddf9;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.rules-body p{margin:3px 0;color:#a9bdcb;font-size:11.5px}
.rules-body strong{color:#e7f6ff}
.rules-body .rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.rules-body ul{margin:4px 0 0;padding-left:17px;color:#a9bdcb;font-size:11.5px}
.rules-body li{margin:2px 0}

.character-guide{margin-top:6px}
.character-guide details{background:rgba(8,24,38,.78);border:1px solid rgba(79,182,227,.28);border-radius:12px;color:var(--ink);backdrop-filter:blur(7px);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.character-guide summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;letter-spacing:.02em;color:#dff5ff;display:flex;align-items:center;justify-content:space-between;gap:8px}
.character-guide summary::-webkit-details-marker{display:none}
.character-guide summary::after{content:'+';font-size:20px;line-height:1;color:#76d2f7}
.character-guide details[open] summary::after{content:'−'}
.character-body{padding:0 10px 10px;max-height:48vh;overflow:auto;border-top:1px solid rgba(79,182,227,.12)}
.character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:9px}
.character-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px;align-items:start;padding:9px;background:linear-gradient(180deg,rgba(14,35,53,.78),rgba(8,24,38,.74));border:1px solid rgba(79,182,227,.16);border-radius:12px;min-width:0}
.character-card img{width:60px;height:60px;border-radius:12px;object-fit:cover;border:2px solid var(--cc);box-shadow:0 0 16px color-mix(in srgb,var(--cc) 24%,transparent)}
.character-card h4{margin:0 0 2px;color:#e8f8ff;font-size:13px}
.character-card .ch-role{color:var(--cc);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.character-card p{margin:0;color:#a9bdcb;font-size:11.5px;line-height:1.35}
.character-card strong{color:#e7f6ff}
.character-faces{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.character-faces .ft{flex:0 0 auto}
@media(max-width:700px){.character-grid{grid-template-columns:1fr}}
@media(max-width:560px){.rules-body .rules-grid{grid-template-columns:1fr}.rules-game{flex-direction:column;align-items:stretch}.rules-game button{width:100%}}

@media(max-width:980px){.home-screen{grid-template-columns:1fr;gap:10px;min-height:100vh;padding:22px}.home-planet{height:38vh;min-height:250px;order:2}.home-content{max-width:760px;justify-self:center;order:1}.home-title{font-size:clamp(38px,9vw,64px)}.home-actions{grid-template-columns:1fr}.home-local-grid{grid-template-columns:1fr 1fr}.home-local-grid button{grid-column:1/-1;margin-top:0}.home-planet img{width:min(76vw,520px);height:min(76vw,520px)}}
@media(max-width:560px){.home-screen{padding:14px}.home-name{display:block}.home-name button{width:100%}.home-local-grid{grid-template-columns:1fr}.home-local-grid button{grid-column:auto;width:100%;margin-bottom:0}.home-action .row{flex-direction:column;align-items:stretch}.home-action button{width:100%} .home-planet{height:34vh;min-height:190px}}

input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;margin:4px 0 8px;background:var(--in);color:var(--ink)}
button{background:var(--acc);color:#04202e;border:0;border-radius:6px;padding:7px 11px;margin:2px 4px 2px 0;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}button:disabled{background:#3b5368;color:#7f95a8;cursor:default}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:#fca5a5;min-height:18px;margin:4px 0 0}.who{color:var(--mut);font-size:12px}
.tag{display:inline-block;border-radius:10px;padding:0 7px;color:#fff;margin:1px 2px;font-size:12px;border:1px solid rgba(255,255,255,.35)}.tag.off{opacity:.3}
.top{grid-area:top;display:flex;gap:8px;min-width:0}.top .inf{flex:1 1 0;min-width:0}.top .brt{flex:0 0 auto}.inf{grid-area:auto}.brt{grid-area:auto}.mus{grid-area:mus}
.left{grid-area:players;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:auto}.players{grid-area:players;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:auto}.events{grid-area:events;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:auto}.right{grid-area:right;display:flex;flex-direction:column;gap:8px}.game>.cdcw{grid-area:cdc;display:flex;align-items:flex-start;justify-content:center;padding:14px 6px 6px;min-width:0;min-height:0;overflow:hidden}.game>.cdcw .cdc{width:min(100%,190px);aspect-ratio:1/1;max-width:190px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;box-sizing:border-box;background:radial-gradient(circle at 35% 28%,rgba(79,182,227,.18),rgba(8,25,40,.9) 58%,rgba(5,15,25,.98));border:2px solid rgba(79,182,227,.75);box-shadow:0 0 0 1px rgba(79,182,227,.16),0 0 22px rgba(79,182,227,.18),inset 0 0 26px rgba(79,182,227,.1);position:relative}.game>.cdcw .cdc::before{content:"";position:absolute;inset:7px;border:1px solid rgba(79,182,227,.22);border-radius:50%;pointer-events:none}.game>.cdcw .cdcd{max-width:82%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;z-index:1}.game>.cdcw .cdc>span{z-index:1;color:var(--ink);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.game>.cdcw .cdc .who{font-weight:400;text-transform:none;letter-spacing:0}
.track{display:flex;gap:5px;align-items:center;overflow-x:auto;margin-top:4px;padding-bottom:2px}
.seg{border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-align:center;font-size:11px;white-space:nowrap;background:var(--in)}
.seg.cur{border-color:#f87171;background:#3a1d26}.hx{color:#a3e635;font-size:12px;letter-spacing:-1px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--mut);margin:0 1px;vertical-align:middle}
.dot.ep{border-color:#f87171;background:#7f1d1d}.dot.on{background:#fff;border-color:#fff}
.dot2{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid #5b84b8;font-size:11px;margin-right:2px}
.dot2.on{background:#3b82f6;border-color:#93c5fd;color:#fff;font-weight:700}.dot2.sk{background:#7f1d1d;border-color:#f87171}
.pls{overflow:auto}.pl{padding:4px 6px;border-radius:6px;margin-bottom:3px}.pl.cur{background:#1b3a55;outline:1px solid var(--acc)}
.cdcw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cdc{width:min(100%,140px);aspect-ratio:1;border-radius:50%;border:3px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}.cdc b{font-size:30px;color:var(--ink)}
.cures{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cure{border:2px solid var(--line);border-radius:6px;padding:8px 2px;text-align:center;color:var(--mut);font-size:12px;background:var(--in)}
.cure.on{background:var(--c);color:#fff;border-color:#fff;box-shadow:0 0 12px var(--c)}
.ringw{grid-area:ring;container-type:size;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.ring{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);container-type:size}
.ring>svg{position:absolute;inset:0;width:100%;height:100%}
.reg{position:absolute;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--line);background:#102639;overflow:hidden}
.reg.here{border-color:var(--acc);box-shadow:0 0 14px rgba(79,182,227,.6)}
.reg .cont{position:absolute;inset:0;width:100%;height:100%}
.rc{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:max(9px,2cqw);padding:0 6%}
.rc h3{margin:0 0 2px;font-size:max(10px,2.4cqw)}.rc .who{font-size:max(9px,1.8cqw);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--mut)}
.ev{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.slot{flex:1;min-height:64px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center;padding:4px}
.act{flex:1;overflow:auto}
.dice{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.die{border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--in);min-width:84px;text-align:center;font-size:13px}
.die.ready{cursor:pointer;border-color:#5c7e99}.die.sel{border-color:var(--acc);background:#1b3a55}
.die.spent{opacity:.4}.die.bio{background:#3a1d26;border-color:#b45b5b}.die small{display:block;color:var(--mut);font-size:11px}
.sub{margin:6px 0 2px;color:var(--mut);font-size:12px}
.log{font-size:12px;color:var(--mut);max-height:90px;overflow:auto;margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:26px;text-align:center;background:rgba(5,12,20,.85);z-index:9}
.over.win{color:#86efac}.over.lose{color:#fca5a5}
.irow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.irow .track{margin-top:4px}
.vdb{margin:4px 0 0 auto;width:auto;padding:3px 10px;font-size:12px;white-space:nowrap}.irow{gap:8px}.irow .brt2{padding-left:8px;gap:6px}.irow .track{gap:4px}
.cures2{display:flex;gap:5px}.cures2 .cure{padding:2px 7px;border-width:1px;border-radius:12px;font-size:12px;border-color:var(--c)}.cures2 .cure:not(.on){opacity:.65}
.brt2{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px;margin-top:4px}.brt2 .track{margin:0}
.bagbd{position:fixed;inset:0;z-index:5}
.bagpop{position:absolute;right:8px;top:34px;z-index:6;min-width:210px;background:var(--panel,#0f1b2b);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.bagr{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}.bagr>span:nth-child(2){flex:1}.bagr b{min-width:22px;text-align:right}
.bagr .bagb{flex:0 0 60px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.bagr .bagb i{display:block;height:100%}
.bagr.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;color:var(--mut)}
@media(max-width:1100px){#app.game{grid-template-columns:minmax(160px,21%) minmax(110px,14%) minmax(0,1fr) minmax(290px,30%)}}
@media(max-width:900px){.top{flex-wrap:wrap}#app.game{height:auto;display:block}#app.game>*{margin-bottom:8px}.ringw{height:100vw}.game>.cdcw{min-height:130px}}
.cube{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#fff;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.45);margin:1px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}

  const cur=S.players[S.turn],my=S.local||S.me===S.turn,live=!S.over&&my,R=S.regions,reg=S.reg,here=cur.region,ro=S.roles[cur.role];
  const cdcN=C.reduce((s,c)=>s+(S.cdc[c]||0),0),protS=new Set();if(S.shield!=null)protS.add(S.shield);
  const regO=R.map((n,j)=>[j,n]);
  const evCard=id=>{const e=S.evd[id],can=!S.over&&cdcN>=e.cost&&!(id==='healthy'&&!S.pc);return `<div class="evk" style="--ec:${e.col||'#4fb6e3'}"><div class="evt">EVENTO</div><div class="evn">${esc(e.n)}</div>${EVIMG[id]?`<img class="evi" src="${EVIMG[id]}" alt="">`:''}<div class="evd">${esc(e.d)}</div><div class="evb"><span class="evc2">Coste <i class="pl2"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" class="pb"/><circle cx="9" cy="9" r="8" class="pr"/><path d="M9 5v8M5 9h8" class="pp"/></svg></i><b>${e.cost}</b></span><button ${can?'':'disabled'} ${id==='healthy'&&!S.pc?'title="Se juega justo después de tirar los dados de la cura"':''} onclick="evOpen('${id}',false)">Jugar</button></div></div>`;};
  const tc=S.treat.reduce((o,c)=>(o[c]=(o[c]||0)+1,o),{}),hx=S.hex,seg=S.rate>>2;
  const pos=i=>{const a=(-90+i*60)*Math.PI/180;return `left:${(50+34.5*Math.cos(a)).toFixed(1)}%;top:${(50+34.5*Math.sin(a)).toFixed(1)}%`;};
  const btn=(c,t,js,alt)=>`<button ${alt?`class="alt" style="border-color:${COL[c]}"`:`style="background:${COL[c]};color:#fff"`} onclick="${js}">${t}</button>`;
  const bp=cur.dice.filter(x=>x.pend).length;
  const TR=['treat','treat2','treat3'],nList=C.reduce((n,c)=>n+(tc[c]||0),0);
  cq=cq.filter(j=>j<nList);
  CA=(live&&!S.cc&&!S.pi&&S.phase==='act'&&!bp&&!S.pc)?curAct():null; // acción activa sobre el mapa
  const MV=!!CA&&(CA.f==='fly'||CA.f==='sail'),TRG=!!CA&&(TR.includes(CA.f)||CA.f==='cross');
  const isT=i=>MV&&(CA.f==='fly'?i!==here:((i-here+6)%6===1||(i-here+6)%6===5));
  const tg=i=>isT(i)?'tgt':(MV&&i!==here?'nt':'');
  const piTarget=i=>live&&S.pi&&S.pi.rolled&&piSel>=0&&S.pi.dice[piSel]&&!S.pi.dice[piSel].placed&&S.pi.dice[piSel].n===i+1;
  const mvAt=i=>isT(i)?`onclick="mvTo(${i})" title="${CA.f==='fly'?'Volar':'Navegar'} a ${esc(R[i])}"`:'';
  const piAt=i=>piTarget(i)?`onclick="piTo(${i})" title="Colocar en ${esc(R[i])}"`:'';
  const outbreakLayer=i=>outbreakActive(i)?'<div class="fx-outbreak"><span class="fx-word">BROTE</span></div>':'';
  const rcubes=i=>C.map(c=>{
    const faces=(S.regd&&S.regd[i]&&Array.isArray(S.regd[i][c]))?S.regd[i][c]:Array.from({length:reg[i][c]},()=>i+1);
    return faces.map(face=>TRG&&i===here?cube(c,face,'hl',`onclick="trTo('${c}','region')" title="${CA.f==='cross'?'Cambiar por cara (+) y llevar al CDC':S.cured[c]?'Tratar '+NAME[c]+' (cura encontrada: va a la bolsa)':'Tratar '+NAME[c]}"`):cube(c,face)).join('');
  }).join('');
  const can=f=>{
    if(TR.includes(f)||f==='cross')return C.some(c=>reg[here][c]>0)||S.treat.length>0;
    if(f==='sample')return C.some(c=>!S.cured[c]&&tc[c]);
    if(f==='contain')return S.treat.length>0;
    if(f==='heli')return !cur.heli;
    return true;};
  const HINT={fly:'✈ <b>Volar</b>: pulsa en el mapa la región a la que quieres ir.',
    sail:'⛵ <b>Navegar</b>: pulsa una de las dos regiones contiguas resaltadas.',
    treat:'💊 <b>Tratar</b>: pulsa en el mapa el dado que quieres tratar (de tu región o del Centro de Tratamiento).',
    sample:'🧪 <b>Muestra</b>: pulsa en el círculo central el dado del que quieres tomar muestra.',
    cross:'➕ <b>Cara (+)</b>: pulsa un dado de tu región o del Centro para llevarlo al CDC.',
    contain:'↩ <b>Devolver a la bolsa</b>: pulsa hasta 3 dados del Centro de Tratamiento.'};
  HINT.treat2=HINT.treat3=HINT.treat;
  const mapUI=i=>{
    const x=cur.dice[i],opts=x.f.split('|'),f=CA?CA.f:null;let o='';
    if(opts.length>1)o+=`<div class="sub">Dado dividido: elige UNA acción (Navegar mueve a una región contigua):</div>`+opts.map(k=>`<button class="${f===k?'':'alt'}" onclick="setMode('${k}')">${FACE[k]}</button>`).join('');
    if(f){
      if(!can(f))o+='<div class="who" style="color:#fcd34d;margin-top:4px">Nada que hacer con esta opción ahora.</div>';
      else if(f==='heli')o+=`<div style="margin-top:4px"><button onclick="A('spend',{i:${i},as:'heli'})">🚁 Guardar Vuelo de emergencia</button></div>`;
      else{
        o+=`<div class="mapmsg">${HINT[f]}${x.n?` <span class="who">(te quedan ${x.left} de ${x.n} acciones)</span>`:''}</div>`;
        if(f==='contain'){const cl=C.flatMap(c=>Array(tc[c]||0).fill(c));
          o+=`<div class="who">Elegidos (${cq.length}/3): ${cq.map(j=>cube(cl[j],'','mini')).join('')||'—'}</div><button ${cq.length?'':'disabled'} onclick="cnGo()">Devolver ${cq.length} a la bolsa</button><button class="alt" onclick="cq=[];render()">Vaciar</button>`;}
      }
    }
    const fin=x.n&&x.left<x.n?`<button class="alt" onclick="A('finish',{i:${i}})">Terminar este dado</button>`:'';
    return `<div id="mapui"><div class="sub">Dado seleccionado${x.n&&!f?` (te quedan ${x.left} de ${x.n} acciones)`:''}:</div>${o}<div style="margin-top:4px">${fin}<button class="alt" onclick="sel=[];amode=null;cq=[];render()">Cancelar selección</button></div></div>`;
  };
  const stat=(()=>{const z=[];if(S.bonus)z.push('Bonus de cura +'+S.bonus+'.');if(S.skipInf)z.push('Noche tranquila activa.');if(S.shield!=null)z.push('Región protegida: '+R[S.shield]+'.');if(S.supply)z.push('Suministros urgentes ×'+S.supply+' listos para la próxima infección.');if(S.comm&&S.comm.length)z.push('Apoyo de la comunidad activo: '+S.comm.map(i=>esc(S.players[i].name)).join(', ')+'.');if(S.planned)z.push('Cambio de planes: '+S.planned.length+' dado(s) con cara elegida en la próxima tirada.');return z.length?`<div class="sub" style="color:#86efac">${z.join(' ')}</div>`:'';})();
  const crb=S.cr&&!S.pc?`<div class="rolld"><div class="sub">Tirada de cura ${NAME[S.cr.c]}:</div><div class="rd" style="justify-content:flex-start">${S.cr.rs.map(v=>cube(S.cr.c,fv2(v))).join('')}</div><div class="sub">${S.cr.rs.map(v=>`<b>${v}</b>`).join(' + ')}${S.cr.bon?' + '+S.cr.bon+' (bonus)':''} = <b>${S.cr.sum}</b> · ${S.cr.ok?'<b style="color:#86efac">¡Cura encontrada!</b>':'Fracaso (hacen falta 13)'}</div></div>`:'';
  let a='',rollB='';
  if(S.cc&&!S.over&&(live||S.local||S.me===S.cc.who)){a+=`<div class="sub" style="color:#fcd34d"><b>Apoyo de la comunidad</b>: ${esc(S.players[S.cc.who].name)} entra en ${R[S.cc.to]}. Elige qué dado de la región va al Centro de Tratamiento:</div><div class="rd" style="justify-content:flex-start;gap:4px">${Object.keys(S.cc.n).map(c=>`<button class="alt" style="width:auto;display:inline-flex;gap:6px;align-items:center;margin:0" onclick="A('ccpick',{c:'${c}'})">${cube(c,'')} ${NAME[c]} ×${S.cc.n[c]}</button>`).join('')}</div>`;}
  else if(live){
    if(S.pi){
      const pd=S.pi.dice;
      a+=`<div class="sub" style="color:#fcd34d"><b>${S.pi.resume==='bio'?'Epidemia':'Infección'}</b></div>`;
      if(!S.pi.rolled){
        a+=`<button type="button" class="pibtn" style="width:auto;font-size:14px;font-weight:800;margin:5px 0 7px;padding:7px 16px" onclick="A('pinf',{})">🎲 Tirar dados</button><div class="sub">Pulsa para tirar los dados y ver qué número ha salido en cada uno.</div>`;
      }else{
        a+=`<div class="sub">${piSel>=0&&pd[piSel]&&!pd[piSel].placed?(pd[piSel].n===0?'Ahora pulsa el CDC para colocar la cara (+).':'Ahora pulsa en el mapa la región '+pd[piSel].n+'.'):'Pulsa un dado para seleccionarlo y colocarlo en su destino.'}</div>`;
        a+=`<div class="rd pidice" style="justify-content:flex-start;gap:5px">${pd.map((d,i)=>`<button type="button" class="${piSel===i?'on':''}" style="width:auto;min-width:48px;padding:5px 8px;border:2px solid ${d.placed?'#4b6275':COL[d.c]};opacity:${d.placed?.45:1};background:${piSel===i?'#1b3a55':'var(--in)'};border-radius:8px" ${d.placed?'disabled':`onclick="piPick(${i})"`}>${cube(d.c,d.n===0?'+':d.n,'big')}</button>`).join('')}</div>`;
        const plus=pd.filter(d=>d.n===0).length, done=pd.filter(d=>d.placed).length;
        a+=`<div class="sub">${done}/${pd.length} dados resueltos${plus?` · ${plus} cara(s) (+) enviada(s) al CDC`:''}</div>`;
        if(S.supply){a+=`<div class="sub">Suministros urgentes: puedes devolver un dado sin colocar a la bolsa.</div>${[...new Set(pd.filter(d=>!d.placed).map(d=>d.c))].map(c=>btn(c,'Devolver '+NAME[c]+' a la bolsa',`A('pinf',{c:'${c}'})`,true)).join('')}`;}
      }
    }
    else if(S.phase==='roll')rollB=`<button onclick="A('roll')">🎲 Tirar dados</button>`;
    else{
      const P=S.phase,nx={act:'Pasar a entregar muestras',give:'Pasar a buscar cura'};
      a+=`<div class="phs">${[['act','1 Acciones'],['give','2 Entregar muestras'],['cure','3 Buscar cura'],['inf','4 Infectar']].map(x=>`<span class="ph ${x[0]===P?'on':''}">${x[1]}</span>`).join('')}</div>`;
      if(P==='act'&&bp){a+=`<div class="sub" style="color:#fca5a5">Tienes ${bp} biorriesgo(s) ☣ sin aplicar. Aún puedes jugar «Intento de contención» para relanzar uno; luego aplícalos.</div><button style="background:#b45b5b;color:#fff" onclick="A('bio')">☣ Aplicar ${bp} biorriesgo(s)</button>`;}
      else if(P==='act'){
        if(!sel.length)a+=S.pend?`<div class="sub" style="color:#fcd34d">Debes usar todos los dados (te quedan ${S.pend}). Elige uno de tus dados y después pulsa en el mapa dónde usarlo. Si no se puede usar, relánzalo.</div>`:`<div class="who">Ya usaste todos los dados. Puedes pasar de fase o terminar el turno.</div>`;
        else{
          const ready=sel.filter(i=>cur.dice[i]&&cur.dice[i].st==='ready');
          a+=`<button class="alt" onclick="A('reroll',{idx:[${ready}]})">Relanzar ${ready.length} dado(s)</button>`;
          if(sel.length===1&&cur.dice[sel[0]]&&cur.dice[sel[0]].st==='ready')a+=mapUI(sel[0]);
        }
      }
      if(P==='give'){
        const gv=[];S.players.filter(p=>p.id!==cur.id&&p.region===here).forEach(q=>C.forEach(c=>{if(cur.samples.some(s=>s.c===c))gv.push(`<button class="alt" onclick="A('give',{to:${q.id},c:'${c}'})">Dar muestras ${NAME[c]} a ${esc(q.name)}</button>`);}));
        a+=gv.length?`<div class="sub">Entregar muestras (jugadores en tu región):</div>${gv.join('')}`:`<div class="who">No hay nadie en tu región o no tienes muestras que entregar.</div>`;
      }
      if(P==='cure'&&S.pc){const sm=S.pc.rs.reduce((x,y)=>x+y,0)+S.pc.bon;a+=`<div class="rolld"><div class="sub">Tirada de cura ${NAME[S.pc.c]}:</div><div class="rd" style="justify-content:flex-start">${S.pc.rs.map(v=>cube(S.pc.c,fv2(v))).join('')}</div><div class="sub">${S.pc.rs.map(v=>`<b>${v}</b>`).join(' + ')}${S.pc.bon?' + '+S.pc.bon+' (bonus)':''} = <b>${sm}</b> (hacen falta 13)</div></div><div class="who">¿Tienes Población sana? Juégala y elige qué dado relanzar.</div><button onclick="A('cureOK')">Aceptar resultado</button>`;}
      else if(P==='cure'){
        const cu=C.filter(c=>!S.cured[c]&&cur.samples.some(s=>s.c===c));
        a+=cu.length?`<div class="sub">Buscar cura (suma 13 o más; 1 intento por turno). El % usa las caras reales de cada color${cur.role==='geneticist'?' y tu +2':''}:</div>${cu.map(c=>`<button style="background:${COL[c]};color:#fff" ${S.tried?'disabled':''} onclick="A('cure',{c:'${c}'})">Cura ${NAME[c]} (${cur.samples.filter(s=>s.c===c).length} muestras · ≈${S.cureP[c]}%)</button>`).join('')}`:`<div class="who">No tienes muestras para buscar cura.</div>`;
      }
      a+=`<div class="sub"></div>${nx[P]?`<button ${S.pend||bp||S.pc?'disabled':''} onclick="A('next')">${nx[P]} ▸</button>`:''}<button class="alt" ${S.pend||bp||S.pc?'disabled':''} onclick="A('end')">Terminar turno e infectar</button>`;
    }
  }else if(!S.over)a+=`<div class="who">Esperando a que juegue ${esc(cur.name)}…</div>`;
  // habilidades que se pueden usar en cualquier momento
  let ab='';
  const an=S.players.find(p=>p.role==='analyst');
  if(!S.over&&an&&(S.local||S.me===an.id)){const cs=C.filter(c=>an.samples.some(s=>s.c===c)),os=S.players.filter(p=>p.id!==an.id);
    if(cs.length&&os.length)ab+=`<div class="evf"><b>${S.roles.analyst.n}</b> <span class="who">entrega muestras a cualquiera</span><br>${sl('agc',cs.map(c=>[c,NAME[c]]))}${sl('agt',os.map(p=>[p.id,p.name]))}<button onclick="agGo()">Entregar</button></div>`;}
  S.players.filter(p=>p.heli&&!S.over&&(S.local||S.me===p.id)).forEach(p=>{ab+=`<div class="evf"><b>🚁 Vuelo de emergencia</b> <span class="who">(${esc(p.name)}) mueve a todos los de una región</span><br>${sl('hf'+p.id,regO)}→${sl('ht'+p.id,regO)}<button onclick="hGo(${p.id})">Volar</button></div>`;});
  if(live&&cur.role==='coordinator'){const os=S.players.filter(p=>p.id!==cur.id&&p.region===here);
    if(os.length)ab+=`<div class="evf"><b>${S.roles.coordinator.n}</b> <span class="who">mueve peones de tu región gratis</span><br>${sl('cmw',[['all','Todos'],...os.map(p=>[p.id,p.name])])}→${sl('cmt',regO.filter(x=>x[0]!==here))}<button onclick="cmGo()">Mover</button></div>`;}
  const dice=cur.dice.length?`<div class="dice">${cur.dice.map((x,i)=>`<div class="die ${x.st} ${sel.includes(i)?'sel':''}" ${live&&S.phase==='act'&&x.st==='ready'?`onclick="tog(${i})"`:''}> ${ftile(x.f,44)}<small style="color:var(--ink)">${esc(fl(x.f))}</small>${x.pend?'<small style="color:#fca5a5">pendiente de aplicar</small>':''}${x.n&&x.st==='ready'?`<small>${x.left}/${x.n} acciones</small>`:''}${x.st==='spent'?'<small>usado</small>':x.st==='ready'&&live&&S.phase==='act'?(x.ok===false?'<small style="color:#fcd34d">no se puede usar: relánzalo</small>':'<small>pulsa para elegir</small>'):''}</div>`).join('')}</div>`:'';
  const rcard=`<div class="rcard" style="--rc:${NEON[cur.role]||ro.col};--rt:${cur.role==='generalist'||cur.role==='analyst'?'#fff':'#04101a'}"><div class="rh"><span>${ro.n}</span><small>6 caras · 1/6 c/u</small></div><div class="rb">${avatar(cur.role,72)}<div class="rf">${S.rfaces[cur.role].map(f=>ftile(f,40)).join('')}</div></div><div class="rdesc">${esc(ro.d)}</div>${rollB?`<div class="rroll">${rollB}</div>`:''}</div>`;
  $.className='game';
  $.innerHTML=`
  <div class="top"><div class="p inf"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span><b>Infección</b> <span class="who">roban ${hx[seg]} dados al acabar el turno · cada ☣ avanza un hueco · los rojos son epidemia</span></span><button class="bagc alt" style="margin:0;width:auto" onclick="bagOpen=!bagOpen;render()" title="Ver qué dados quedan en la bolsa">🎲 Bolsa: <b>${S.bag}</b> dados ${bagOpen?'▴':'▾'}</button></div>
   ${bagOpen&&S.bagc?`<div class="bagbd" onclick="bagOpen=false;render()"></div><div class="bagpop"><div class="who" style="margin-bottom:4px">Dados que quedan en la bolsa</div>${C.map(c=>`<div class="bagr">${cube(c,'','mini')}<span>${NAME[c]}</span><span class="bagb"><i style="width:${S.bag?Math.round(S.bagc[c]*100/S.bag):0}%;background:${c==='black'?'#9ca3af':COL[c]}"></i></span><b>${S.bagc[c]}</b></div>`).join('')}<div class="bagr tot"><span></span><span>Total</span><b>${S.bag}</b></div></div>`:''}
   <div class="irow"><div class="track">${hx.map((n,k)=>`<div class="seg ${k===seg?'cur':''}"><div class="hx">${'⬢'.repeat(n)}</div>${[0,1,2,3].map(j=>`<span class="dot ${j===0&&k>0?'ep':''} ${k*4+j===S.rate?'on':''}"></span>`).join('')}</div>`).join('')}<div class="seg">☠</div></div>
   <div class="brt2"><b>Brotes ${S.out}/8</b><div class="track">${[0,1,2,3,4,5,6,7].map(j=>`<span class="dot2 ${j===S.out?'on':''}">${j}</span>`).join('')}<span class="dot2 sk">☠</span></div></div>
   <div class="brt2"><b>Curas ${C.filter(k=>S.cured[k]).length}/4</b><div class="cures2">${C.map(k=>`<div class="cure ${S.cured[k]?'on':''}" style="--c:${COL[k]}">${NAME[k]}</div>`).join('')}</div></div>
   <button class="alt vdb" onclick="dm=true;render()">Ver dados</button></div></div></div>
  <div class="players">
   <div class="p pls"><b>Jugadores</b>${S.players.map(p=>{const r=S.roles[p.role];return `<div class="pl ${p.id===S.turn?'cur':''}" style="border-left:4px solid ${NEON[p.role]||r.col}"><div class="plh"><div class="plm">${avatar(p.role,26)}<div class="pln">${pawn(p.role,'15px',esc(p.name),false)} <b style="color:${NEON[p.role]||r.col}">${esc(p.name)}</b>${!S.local&&S.me===p.id?' <span class="who">(tú)</span>':''}${p.heli?' 🚁':''}<div class="who" title="${esc(r.d)}">${esc(r.n)}</div></div></div><div class="ftg">${S.rfaces[p.role].map(f=>ftile(f,21)).join('')}</div></div>${p.samples.length?`<div class="smp">${p.samples.map(s=>cube(s.c,'🧪')).join('')}</div>`:''}</div>`;}).join('')}</div>
  </div>
  <div class="events">
   <div class="p evp"><b>Cartas de evento</b> <span class="who">se pagan con dados del CDC (hay ${cdcN}) · mazo: ${S.evLeft}</span>
    <div class="ev">${S.evUp.map(id=>evCard(id)).join('')||'<div class="slot">No quedan cartas.</div>'}</div>
    ${evForm()}
    ${S.evDisc.length?`<div class="who" style="margin-top:6px">Descartadas: ${S.evDisc.map(id=>esc(S.evd[id].n)).join(', ')}</div>`:''}</div>
   <div class="rules-game">${RULES_HTML}${CHARACTERS_HTML}<button class="alt exit-game" onclick="leave();home()" title="Salir de la partida" aria-label="Salir de la partida">Salir</button></div>
  </div>
  <div class="cdcw"><div class="cdc" ${S.pi&&S.pi.rolled&&piSel>=0&&S.pi.dice[piSel]&&!S.pi.dice[piSel].placed&&S.pi.dice[piSel].n===0?`onclick="piToCdc()" style="cursor:pointer;outline:2px solid #fcd34d;box-shadow:0 0 0 4px rgba(252,211,77,.15),0 0 22px rgba(252,211,77,.18)"`:''}><div class="cdcd">${C.map(c=>cube(c,'+').repeat(S.cdc[c]||0)).join('')||'<span class="who">vacío</span>'}</div><span>CDC</span></div></div>
  <div class="ringw"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34.5" fill="none" stroke="#2b4660" stroke-width=".7" stroke-dasharray="2 2"/></svg>
   <div class="mid"><b style="color:var(--ink)">Centro de tratamiento</b>${ctrCircle(tc,CA,cq)}<div class="who">de aquí se toman las muestras</div></div>
   ${R.map((n,i)=>`<div class="reg ${i===here?'here':''} ${protS.has(i)?'prot':''} ${tg(i)} ${piTarget(i)?'tgt':''}" style="${pos(i)}" ${piAt(i)} ${mvAt(i)}><img class="cont" src="${REGIMG[i]}" alt="">${outbreakLayer(i)}
    <div class="rc"><h3>${i+1} · ${n}</h3><div class="rd">${rcubes(i)}</div>
    <div class="pawns">${S.players.filter(p=>p.region===i).map(p=>pawn(p.role,'max(20px,4.6cqw)',esc(p.name),p.id===S.turn)).join('')||'&nbsp;'}</div></div></div>`).join('')}</div></div>
  <div class="right">
   <div class="p act"><b>Turno de ${esc(cur.name)}</b> <span class="who">está en ${R[here]}</span>
    ${rcard}
    ${stat}${crb}${dice}${a}${ab}<div class="err">${esc(msg)}</div>
    <div class="log">${S.log.slice(-12).reverse().map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>
  </div>
  ${dm?diceModal():''}
  ${cm?characterModal():''}
  ${epidemicActive()?'<div class="fx-epidemic"><div class="fx-word">EPIDEMIA</div></div>':''}
  ${cureActive()?`<div class="fx-cure"><div class="fx-cure-box"><div class="fx-word">CURA ${esc((NAME[FX.cureColor]||'').toUpperCase())} ENCONTRADA</div><div class="fx-sub">Un paso más cerca de salvar a la humanidad.</div></div></div>`:''}
  ${S.over?`<div class="over ${S.over}">${S.over==='win'?'¡Victoria! Habéis salvado a la humanidad.':'Derrota'}<div class="who" style="font-size:14px">${esc(S.log[S.log.length-1]||'')}</div><button onclick="leave();home()">Volver al inicio</button></div>`:''}`;
}
function render(){if(!S)return home();S.started?game():lobby();}
if(ses)connect();else home();
</script></body></html>
